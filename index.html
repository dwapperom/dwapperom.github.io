<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
            <meta name="description" content="Dennis Wapperom — software developer. Open source React libraries and other things I build." />

            <meta property="og:type" content="website" />
            <meta property="og:url" content="https://dennis.is-a.dev/" />
            <meta property="og:title" content="Dennis Wapperom" />
            <meta property="og:description" content="Software developer. Open source React libraries and other things I build." />

            <meta name="twitter:card" content="summary" />

            <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%E2%9A%A1</text></svg>" />

        <title>Dennis Wapperom</title>
        <style>
            html, body {
                height: 100%;
                margin: 0;
                background: #0a0a0a;
                color: #d9d9d9;
                font-family: "Courier New", monospace;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                overflow: hidden;
                transition:
                    background 250ms ease,
                    color 250ms ease,
                    text-shadow 250ms ease;
            }

            h1 {
                margin: 0;
                font-size: 3rem;
                font-weight: 400;
                opacity: 0.95;
                transition:
                    color 250ms ease,
                    text-shadow 250ms ease,
                    transform 150ms ease;
            }

            .glitch-text {
                position: relative;
                font-size: 1.4rem;
                margin-top: 0.6rem;
                opacity: 0.9;
                transition:
                    color 250ms ease,
                    text-shadow 250ms ease,
                    transform 150ms ease;
            }

            .glitch-text::before,
            .glitch-text::after {
                content: attr(data-text);
                position: absolute;
                inset: 0;
                color: inherit;
                opacity: 0.15;
                pointer-events: none;
                mix-blend-mode: lighten;
            }

            .glitch-text::before {
                animation: glitchLayer1 4s infinite steps(1, end);
            }

            .glitch-text::after {
                animation: glitchLayer2 4s infinite steps(1, end);
            }

            @keyframes glitchLayer1 {
                0%, 92%, 100% {
                    clip-path: inset(0 0 0 0);
                    transform: translate(0, 0);
                }
                10% {
                    clip-path: inset(0 0 40% 0);
                    transform: translate(3px, 0);
                }
                11% {
                    clip-path: inset(50% 0 0 0);
                    transform: translate(-3px, 0);
                }
                12% {
                    clip-path: inset(20% 0 30% 0);
                    transform: translate(2px, 0);
                }
            }

            @keyframes glitchLayer2 {
                0%, 92%, 100% {
                    clip-path: inset(0 0 0 0);
                    transform: translate(0, 0);
                }
                8% {
                    clip-path: inset(30% 0 30% 0);
                    transform: translate(-2px, 0);
                }
                9% {
                    clip-path: inset(10% 0 60% 0);
                    transform: translate(2px, 0);
                }
                10% {
                    clip-path: inset(60% 0 10% 0);
                    transform: translate(-1px, 0);
                }
            }

            .links {
                display: flex;
                gap: 1rem;
                margin-top: 1.3rem;
            }

            .links span {
                color: #666;
                pointer-events: none;
            }

            a {
                color: #0ff;
                text-decoration: none;
                font-size: 1rem;
                border-bottom: 1px dotted #0ff;
                transition:
                    color 200ms ease,
                    border-color 200ms ease,
                    text-shadow 250ms ease;
            }

            a:hover {
                color: #fff;
                border-bottom: 1px solid #fff;
            }

            body.cheat {
                color: #5cff95;
                text-shadow: 0 0 8px rgba(92, 255, 149, 0.35);
            }

            body.cheat::after {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                background: repeating-linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, 0.035) 0px,
                    rgba(255, 255, 255, 0.035) 1px,
                    transparent 1px,
                    transparent 4px
                );
                opacity: 0.2;
            }

            body.cheat a {
                color: #8bffb1;
                border-bottom-color: #8bffb1;
                text-shadow: 0 0 8px rgba(92, 255, 149, 0.45);
            }

            body.cheat a:hover {
                color: #d8ffe5;
                border-bottom-color: #d8ffe5;
            }

            body.glitch-boost h1,
            body.glitch-boost .glitch-text {
                transform: translateX(1px) skewX(2deg);
            }

            body.glitch-boost .glitch-text::before,
            body.glitch-boost .glitch-text::after {
                opacity: 0.4;
                animation-duration: 0.22s;
            }

            .toaster {
                position: fixed;
                right: 20px;
                bottom: 20px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                max-width: min(360px, calc(100vw - 40px));
                margin: 0;
                padding: 0;
                list-style: none;
            }

            .toaster[data-empty] {
                display: none;
            }

            .toast {
                display: flex;
                align-items: flex-start;
                gap: 10px;
                padding: 10px 14px;
                background: rgba(0, 0, 0, 0.92);
                color: #8bffb1;
                border: 1px solid rgba(92, 255, 149, 0.5);
                font-size: 0.85rem;
                line-height: 1.4;
                box-shadow: 0 0 18px rgba(92, 255, 149, 0.16);
                animation: toastIn 400ms ease both;
            }

            @keyframes toastIn {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .toast-content {
                flex: 1;
            }

            .toast-title,
            .toast-body {
                margin: 0;
            }

            .toast-body {
                opacity: 0.75;
            }

            .toast-dismiss {
                padding: 0;
                background: none;
                border: 0;
                color: inherit;
                font: inherit;
                line-height: 1;
                opacity: 0.55;
                cursor: pointer;
                transition: opacity 200ms ease;
            }

            .toast-dismiss:hover {
                opacity: 1;
            }
        </style>
    </head>
    <body>
        <h1>Dennis Wapperom</h1>
        <div class="glitch-text" id="role" data-text="Software Developer">Software Developer</div>

        <div class="links">
            <a href="https://github.com/dwapperom" target="_blank" rel="noreferrer">github</a>
            <span>•</span>
            <a href="/react-use-notifications">react-use-notifications</a>
        </div>

        <div id="toast-root"></div>

        <script type="module">
            const roles = [
                "Software Developer",
                "UI/UX Engineer",
                "Happy Guy"
            ];

            const roleEl = document.getElementById("role");
            let roleIndex = 0;

            setInterval(() => {
                roleIndex = (roleIndex + 1) % roles.length;
                roleEl.setAttribute("data-text", roles[roleIndex]);
                roleEl.textContent = roles[roleIndex];
            }, 3000);

            const konami = [
                "ArrowUp",
                "ArrowUp",
                "ArrowDown",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                "ArrowLeft",
                "ArrowRight",
                "b",
                "a"
            ];

            let konamiIndex = 0;
            let activated = false;

            window.addEventListener("keydown", (event) => {
                if (activated) {
                    return;
                }

                const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
                const expectedKey = konami[konamiIndex];

                if (key === expectedKey) {
                    triggerGlitchBoost(120);
                    konamiIndex += 1;

                    if (konamiIndex === konami.length) {
                        activated = true;
                        triggerFinalGlitch();
                    }

                    return;
                }

                konamiIndex = key === konami[0] ? 1 : 0;
            });

            function triggerGlitchBoost(duration) {
                document.body.classList.add("glitch-boost");

                window.setTimeout(() => {
                    document.body.classList.remove("glitch-boost");
                }, duration);
            }

            function triggerFinalGlitch() {
                roleEl.textContent = "ACCESS GRANTED";
                roleEl.setAttribute("data-text", "ACCESS GRANTED");

                document.body.classList.add("glitch-boost");

                window.setTimeout(() => {
                    document.body.classList.remove("glitch-boost");
                    document.body.classList.add("cheat");
                    spawnBadge();
                }, 320);
            }

            const REACT_VERSION = "19.3.0";
            const NOTIFICATIONS_VERSION = "1.0.0";

            const toastClassNames = {
                region: "toaster",
                toast: "toast",
                content: "toast-content",
                title: "toast-title",
                body: "toast-body",
                dismiss: "toast-dismiss"
            };

            async function spawnBadge() {
                const [react, reactDom, notifications] = await Promise.all([
                    import(`https://esm.sh/react@${REACT_VERSION}`),
                    import(`https://esm.sh/react-dom@${REACT_VERSION}/client`),
                    import(
                        `https://esm.sh/react-use-notifications-ui@${NOTIFICATIONS_VERSION}`
                        + `?deps=react@${REACT_VERSION},react-dom@${REACT_VERSION}`
                        + `,react-use-notifications@${NOTIFICATIONS_VERSION}`
                    )
                ]);

                const { createElement, useEffect } = react;
                const {
                    ToasterProvider,
                    NotificationToaster,
                    NotificationPresentation,
                    ToastVariant,
                    useToaster,
                    useToasts
                } = notifications;

                function CheatToast() {
                    const { show, dismiss } = useToaster({
                        presentation: NotificationPresentation.InApp,
                        variant: ToastVariant.Success,
                        duration: 0
                    });
                    const toasts = useToasts();

                    useEffect(() => {
                        const timer = window.setTimeout(() => {
                            show("ACCESS GRANTED", {
                                tag: "konami",
                                body: "What kind of nerd uses the konami code on a website…?"
                            });
                        }, 1700);

                        return () => window.clearTimeout(timer);
                    }, [show]);

                    return createElement(NotificationToaster, {
                        toasts,
                        onDismiss: dismiss,
                        classNames: toastClassNames,
                        label: "Easter eggs"
                    });
                }

                reactDom
                    .createRoot(document.getElementById("toast-root"))
                    .render(createElement(ToasterProvider, null, createElement(CheatToast)));
            }
        </script>
    </body>
</html>
